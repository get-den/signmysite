<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Molly</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 620px; margin: 80px auto; padding: 0 20px; line-height: 1.6; color: #111; }
    h1 { font-size: 40px; margin: 0 0 4px; }
    .muted { color: #777; }
    .art { width: 100%; height: 260px; border-radius: 12px; margin: 24px 0;
           background: linear-gradient(135deg,#e9f0ff,#fce9f3); }
    /* A one-time nudge toward the widget badge in the bottom-right. Dismissed on click. */
    #sms-hint { position: fixed; right: 26px; bottom: 98px; z-index: 2147482000;
      max-width: 234px; background: #111; color: #fff; padding: 12px 15px; border-radius: 14px;
      font: 500 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 14px 44px rgba(0,0,0,.24); cursor: pointer;
      opacity: 0; transform: translateY(8px); transition: opacity .3s ease, transform .3s ease; }
    #sms-hint.in { opacity: 1; transform: translateY(0); animation: sms-bob 1.9s ease-in-out .4s infinite; }
    #sms-hint.out { opacity: 0; transform: translateY(8px); pointer-events: none; animation: none; }
    #sms-hint::after { content: ""; position: absolute; right: 22px; bottom: -6px; width: 14px; height: 14px;
      background: #111; transform: rotate(45deg); border-radius: 0 0 3px 0; }
    @keyframes sms-bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @media (prefers-reduced-motion: reduce) { #sms-hint.in { animation: none } }
    /* On phones the demo lives inside a short framed viewport on the landing page.
       Keep molly's page short enough to fit without its own scrollbar, so a touch
       drag scrolls the landing page (not the frame) — and the widget badge stays
       in view. */
    @media (max-width: 560px) {
      body { margin: 26px auto; }
      h1 { font-size: 32px; }
      .art { height: 130px; margin: 16px 0; }
      #sms-hint { right: 16px; bottom: 92px; max-width: 210px; }
    }

    /* The "inline" demo: a link sitting in molly's own content. */
    .sms-inline-demo { margin-top: 4px; }
    .sms-inline-demo a { color: #111; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

    /* ---- style switcher (standalone demo only; hidden inside the landing iframe) ---- */
    html.sms-experiment body { margin-top: 96px; }
    html.sms-experiment #sms-hint { display: none; }
    #sms-switch { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 2147483600; max-width: calc(100vw - 24px); }
    .sms-switch-inner { display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.82); backdrop-filter: blur(14px) saturate(1.4);
      border: 1px solid rgba(0,0,0,.08); border-radius: 999px; padding: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 34px rgba(0,0,0,.16);
      font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .sms-switch-label { padding: 0 8px; color: #8a8a90; font-size: 11px; letter-spacing: .04em;
      text-transform: uppercase; flex: 0 0 auto; }
    .sms-chips { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; }
    .sms-chips::-webkit-scrollbar { display: none; }
    .sms-chip { flex: 0 0 auto; border: 0; background: transparent; color: #44454b; cursor: pointer;
      font: inherit; padding: 7px 12px; border-radius: 999px; text-transform: capitalize;
      transition: background .12s ease, color .12s ease; }
    .sms-chip:hover { background: rgba(0,0,0,.05); color: #111; }
    .sms-chip.on { background: #111; color: #fff; }
    .sms-nav { flex: 0 0 auto; width: 32px; height: 32px; border: 0; border-radius: 50%;
      background: rgba(0,0,0,.05); color: #111; cursor: pointer; font-size: 18px; line-height: 1;
      display: grid; place-items: center; }
    .sms-nav:hover { background: rgba(0,0,0,.1); }
    .sms-count { padding: 0 6px 0 2px; color: #b5b5ba; font-size: 11px; flex: 0 0 auto; }
    @media (max-width: 560px) { .sms-switch-label { display: none; } }
  </style>
</head>
<body>
  <h1>molly 🦕</h1>
  <p class="muted">i draw dinosaurs and build little games.</p>

  <p>lately: drawing the stegosaurus below, and fixing my lava-jump game.</p>

  <div class="art"></div>

  <p>more soon, m</p>

  <div id="sms-hint">👋 The signmysite widget. Try it.</div>

  <script>
    const params = new URLSearchParams(location.search);

    // The floating badge styles (quietest → most expressive) + "inline", which isn't a
    // badge at all — it's a link the owner drops into their own page.
    const STYLES = ["circle", "chip", "chip-center", "chip-corner", "peek", "peek-center", "inline"];
    const current = params.has("launcher") ? params.get("launcher") : "circle";

    // "inline" — put it in your content, like an <a> tag. We inject a normal-looking
    // link into molly's page; the widget finds it (data-signmysite), hides the floating
    // badge, and opens the card when it's clicked. With JS off it's just a profile link.
    const isInline = current === "inline";
    if (isInline) {
      const p = document.createElement("p");
      p.className = "sms-inline-demo";
      p.innerHTML = 'p.s. <a href="/@molly" data-signmysite>see who\'s reading this page →</a>';
      document.querySelector("#sms-hint").before(p);
    }

    const tag = document.createElement("script");
    tag.src = "/w/7f3a9c2e8b1d4f6a.js";
    if (!isInline && params.has("launcher")) tag.dataset.launcher = params.get("launcher");
    if (params.has("collapsed")) tag.dataset.collapsed = params.get("collapsed");
    // ?pins=stack|thumbs|ring — preview each pinned-sites presentation.
    if (params.has("pins")) tag.dataset.pins = params.get("pins");
    document.body.append(tag);

    // The style switcher only shows on the standalone demo page — never inside the
    // landing page's iframe (where this same file is the marketing demo). ?styles=0
    // force-hides it; ?styles=1 force-shows it.
    const framed = window.self !== window.top;
    const showSwitcher = params.get("styles") === "1" || (!framed && params.get("styles") !== "0");

    if (showSwitcher) {
      document.documentElement.classList.add("sms-experiment");
      // Switching reloads with the new ?launcher= so every style renders fresh and
      // correct (each has its own markup + CSS) — no half-applied live swaps.
      const go = (style) => { const u = new URL(location.href); u.searchParams.set("launcher", style); location.href = u.toString(); };
      const cycle = (d) => { const i = STYLES.indexOf(current); go(STYLES[(i + d + STYLES.length) % STYLES.length]); };

      const bar = document.createElement("div");
      bar.id = "sms-switch";
      bar.innerHTML =
        '<div class="sms-switch-inner">' +
          '<span class="sms-switch-label">Badge style</span>' +
          '<button class="sms-nav" data-d="-1" aria-label="Previous style">‹</button>' +
          '<div class="sms-chips"></div>' +
          '<button class="sms-nav" data-d="1" aria-label="Next style">›</button>' +
          '<span class="sms-count"></span>' +
        '</div>';
      const chips = bar.querySelector(".sms-chips");
      STYLES.forEach((s) => {
        const b = document.createElement("button");
        b.className = "sms-chip" + (s === current ? " on" : "");
        b.textContent = s;
        b.setAttribute("aria-pressed", String(s === current));
        b.addEventListener("click", () => go(s));
        chips.append(b);
      });
      bar.querySelectorAll(".sms-nav").forEach((n) => n.addEventListener("click", () => cycle(+n.dataset.d)));
      bar.querySelector(".sms-count").textContent = (STYLES.indexOf(current) + 1) + " / " + STYLES.length;
      document.body.append(bar);

      // Arrow keys cycle through styles. Keep the selected chip in view.
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") cycle(1);
        else if (e.key === "ArrowLeft") cycle(-1);
      });
      const on = chips.querySelector(".sms-chip.on");
      if (on) on.scrollIntoView({ inline: "nearest", block: "nearest" });
    } else {
      // Landing/iframe mode: point first-time visitors at the badge, then get out of
      // the way — the hint disappears as soon as you click it (or tap the widget).
      let hint = document.getElementById("sms-hint");
      const dismissHint = () => {
        if (!hint) return;
        const el = hint; hint = null;
        el.classList.replace("in", "out");
        setTimeout(() => el.remove(), 320);
      };
      setTimeout(() => hint && hint.classList.add("in"), 900); // reveal once the badge has rendered
      hint.addEventListener("click", dismissHint);
      // Tapping the widget itself (it lives in a shadow root) also counts as "found it".
      document.addEventListener("click", (e) => {
        if (!hint) return;
        const path = e.composedPath ? e.composedPath() : [];
        if (path.some((n) => n.nodeType === 1 && n.hasAttribute && n.hasAttribute("data-signmysite-widget"))) dismissHint();
      }, true);
    }
  </script>
</body>
</html>
