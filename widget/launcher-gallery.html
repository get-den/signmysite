<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Den launcher variations</title>
  <style>
    body { margin: 0; padding: 28px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f6f2; color: #0a0a0a; }
    h1 { margin: 0 0 8px; font-size: clamp(34px, 6vw, 72px); line-height: .9; letter-spacing: -.07em; }
    p { margin: 0 0 26px; color: #74746f; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .tile { border: 1px solid #e5e2da; border-radius: 28px; overflow: hidden; background: white; box-shadow: 0 18px 60px rgba(20,20,20,.08); }
    .tile b { display: block; padding: 14px 16px; border-bottom: 1px solid #eeeae2; }
    iframe { width: 100%; height: 220px; border: 0; display: block; background: linear-gradient(135deg,#fff,#f2f0ff); }
    code { padding: 2px 6px; border-radius: 7px; background: #eeeae2; }
  </style>
</head>
<body>
  <h1>Closed widget states</h1>
  <p>Use <code>data-launcher</code>: pill, avatar, circle, logo, mark, glass, neon, halo, slab.</p>
  <div class="grid" id="grid"></div>
  <script>
    const variants = ["avatar", "circle", "pill", "logo", "mark", "glass", "neon", "halo", "slab"];
    grid.innerHTML = variants.map((v) => `
      <div class="tile">
        <b>${v}</b>
        <iframe src="/widget/demo.html?collapsed=true&launcher=${v}" loading="lazy"></iframe>
      </div>
    `).join("");
  </script>
</body>
</html>
